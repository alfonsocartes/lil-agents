name: LilUsage
options:
  bundleIdPrefix: com.wandity
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  UsageCore:
    type: framework
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: ../Sources/UsageCore
        name: UsageCore
        type: group
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wandity.lilagents.core
        PRODUCT_NAME: UsageCore
        PRODUCT_MODULE_NAME: UsageCore
        GENERATE_INFOPLIST_FILE: "YES"
        SKIP_INSTALL: "YES"
        DEFINES_MODULE: "NO"
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        SWIFT_INSTALL_OBJC_HEADER: "NO"
        TARGETED_DEVICE_FAMILY: "1,2"
  LilUsage:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: LilUsage
      - path: Shared
    dependencies:
      - target: UsageCore
        embed: true
        codeSign: true
      - target: LilUsageWidget
        embed: true
        codeSign: true
      - sdk: WidgetKit.framework
      - sdk: BackgroundTasks.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wandity.lilagents
        PRODUCT_NAME: LilUsage
        PRODUCT_MODULE_NAME: LilUsage
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: LilUsage/Info.plist
        CODE_SIGN_ENTITLEMENTS: LilUsage/LilUsage.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets: []
  LilUsageWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: LilUsageWidget
      - path: Shared
    dependencies:
      - target: UsageCore
        embed: true
        codeSign: true
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: AppIntents.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wandity.lilagents.widget
        PRODUCT_NAME: LilUsageWidget
        PRODUCT_MODULE_NAME: LilUsageWidget
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: LilUsageWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: LilUsageWidget/LilUsageWidget.entitlements
        APPLICATION_EXTENSION_API_ONLY: "YES"
        SKIP_INSTALL: "YES"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  LilUsage:
    build:
      targets:
        LilUsage: all
        UsageCore: all
        LilUsageWidget: all
    run:
      config: Debug
      askForAppToLaunch: true
